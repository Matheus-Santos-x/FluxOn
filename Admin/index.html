<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>FluxON Admin</title>
  <meta name="theme-color" content="#161012" />
  <meta name="robots" content="noindex, nofollow" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="pwa-icon.png" />
  <link rel="apple-touch-icon" href="pwa-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.1/cropper.min.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.1/cropper.min.js"></script>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<!-- LOGIN -->
<section id="login" class="login hidden">
  <div class="login-card">
    <div class="marca"><span class="marca-sinal" data-ico="escudo"></span><b>FluxON</b><em>admin</em></div>
    <h1>Entrar no painel</h1>
    <p>Só a equipe Evorise tem acesso.</p>
    <div id="google-btn"></div>
    <div class="ou">ou com a senha</div>
    <form id="login-senha" class="login-senha">
      <input id="login-senha-input" class="inp" type="password" placeholder="Senha de acesso" autocomplete="current-password" />
      <button type="submit" class="btn btn-pri">Entrar</button>
    </form>
    <p id="login-status" class="login-status"></p>
  </div>
</section>

<!-- APP -->
<div id="app" class="hidden">
  <header class="topo">
    <a href="#/" class="marca" style="text-decoration:none"><span class="marca-sinal" data-ico="escudo"></span><b>FluxON</b><em>admin</em></a>
    <nav class="topo-nav">
      <a href="#/" data-nav="restaurantes"><span data-ico="loja"></span>Restaurantes <span class="cont" id="cont-rest"></span></a>
      <a href="#/donos" data-nav="donos"><span data-ico="pessoas"></span>Donos <span class="cont" id="cont-donos"></span></a>
    </nav>
    <div class="topo-eu">
      <span id="eu-email"></span>
      <img id="eu-foto" class="hidden" alt="" referrerpolicy="no-referrer" />
      <button type="button" class="btn btn-ghost btn-sm" id="btn-sair"><span data-ico="sair"></span>Sair</button>
    </div>
  </header>
  <main class="palco" id="palco"></main>
  <div class="salvar-barra" id="salvar-barra" role="status">
    <span>Alterações não salvas</span>
    <button type="button" class="btn btn-ghost btn-sm" id="salvar-descartar">Descartar</button>
    <button type="button" class="btn btn-pri btn-sm" id="salvar-ok">Salvar</button>
  </div>
</div>

<div class="toasts" id="toasts" aria-live="polite"></div>

<!-- RECORTE DE FOTO -->
<div class="crop-modal-backdrop hidden" id="crop-modal-backdrop">
  <div class="crop-modal-box">
    <div class="crop-modal-header">
      <span class="crop-modal-title">Recortar imagem</span>
      <button class="crop-modal-close" onclick="cancelCrop()" aria-label="Fechar">×</button>
    </div>
    <div class="crop-img-wrap"><img id="crop-image" src="" alt="" /></div>
    <div class="crop-modal-footer">
      <button class="btn" onclick="cancelCrop()">Cancelar</button>
      <button class="btn btn-pri" onclick="confirmCrop()">Usar esta imagem</button>
    </div>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
