<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Acompanhe sua entrega</title>
<meta name="theme-color" content="#16171a">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800&family=Barlow:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
/* Página que o cliente abre pelo link do WhatsApp: o mapa ocupa a tela e o cartão embaixo diz o que está acontecendo. */
:root{
  --bg:#16171a; --bg-2:#1f2125; --line:#34373d; --text:#f4f5f7; --muted:#a3a7af;
  --acc:#e5484d; --ok:#34d27b; --info:#5aa7ff;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif; --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
@media (prefers-color-scheme:light){:root{--bg:#f2f2ef;--bg-2:#fff;--line:#dddcd6;--text:#141517;--muted:#5d6068;--ok:#0e8a4a;--info:#1060c8;color-scheme:light}}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:16px/1.45 var(--body);-webkit-font-smoothing:antialiased}
#mapa{position:fixed;inset:0;z-index:1;background:var(--bg-2)}
@media (prefers-color-scheme:dark){#mapa .leaflet-tile-pane{filter:invert(1) hue-rotate(180deg) brightness(.9) contrast(.9) saturate(.6)}}
.cartao{position:fixed;left:0;right:0;bottom:0;z-index:10;max-width:560px;margin:0 auto;
  padding:18px max(18px,env(safe-area-inset-right)) calc(18px + env(safe-area-inset-bottom)) max(18px,env(safe-area-inset-left));
  background:var(--bg-2);border-radius:24px 24px 0 0;border:1px solid var(--line);border-bottom:0;box-shadow:0 -20px 40px -20px rgba(0,0,0,.5)}
.rest{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.logo{width:44px;height:44px;border-radius:12px;background:var(--acc) center/cover no-repeat;display:grid;place-items:center;font:800 19px var(--display);color:#fff;flex-shrink:0}
.rest b{display:block;font:700 19px var(--display)}
.rest small{color:var(--muted)}
h1{margin:0;font:800 32px/1.05 var(--display);letter-spacing:-.005em}
.sub{margin:6px 0 0;color:var(--muted);font-size:15.5px}
.etapas{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:16px 0 4px}
.etapas i{height:6px;border-radius:3px;background:var(--line)}
.etapas i.on{background:var(--acc)}
.etapas i.agora{background:linear-gradient(90deg,var(--acc) 50%,var(--line) 50%);background-size:200% 100%;animation:andar 1.6s linear infinite}
@keyframes andar{from{background-position:100% 0}to{background-position:0 0}}
.legenda{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;font-size:12.5px;color:var(--muted);font-weight:600}
.botao{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:14px;min-height:50px;border-radius:14px;border:1px solid var(--line);background:var(--bg);color:var(--text);font-weight:700;text-decoration:none}
.moto{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-size:24px;background:var(--acc);border:3px solid #fff;box-shadow:0 0 0 8px color-mix(in srgb,var(--acc) 25%,transparent),0 6px 14px rgba(0,0,0,.4);transition:transform .3s}
.casa{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-size:19px;background:#fff;border:3px solid var(--acc);box-shadow:0 4px 10px rgba(0,0,0,.35)}
.erro{position:fixed;inset:0;display:grid;place-items:center;padding:24px;text-align:center;z-index:20;background:var(--bg)}
.erro b{display:block;font:800 28px var(--display);margin-bottom:6px}
.hidden{display:none!important}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="mapa" aria-label="Mapa da entrega"></div>

<section class="cartao" aria-live="polite">
  <div class="rest">
    <span class="logo" id="logo" aria-hidden="true"></span>
    <div><b id="rest-nome">Carregando…</b><small id="pedido-num"></small></div>
  </div>
  <h1 id="titulo">Buscando seu pedido…</h1>
  <p class="sub" id="sub"></p>
  <div class="etapas" aria-hidden="true"><i id="e1"></i><i id="e2"></i><i id="e3"></i></div>
  <div class="legenda" aria-hidden="true"><span>Preparando</span><span>A caminho</span><span>Entregue</span></div>
  <a class="botao hidden" id="ligar" href="#">📞 Falar com o restaurante</a>
</section>

<div class="erro hidden" id="erro"><div><b>Pedido não encontrado</b><p>Confira se o link está completo ou fale com o restaurante.</p></div></div>

<script src="config.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
<script src="acompanhar.js"></script>
</body>
</html>
