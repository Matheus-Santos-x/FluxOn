server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  # a página do cliente pode ser aberta dentro de outro site (ex.: o rastreio)
  add_header Permissions-Policy "geolocation=(self)" always;

  location = /sw.js { add_header Cache-Control "no-cache"; }
  location = /index.html { add_header Cache-Control "no-cache"; }
  location = /acompanhar.html { add_header Cache-Control "no-cache"; }
  location = /config.js { add_header Cache-Control "no-cache"; }
  location ~* \.(js|css)$ { add_header Cache-Control "no-cache"; }
  location / { try_files $uri $uri/ /index.html; }
}
