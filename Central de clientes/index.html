    <h1 class="nome" id="nome"></h1>
    <p class="frase" id="frase" hidden></p>

  <!-- painel de vidro com os botões -->

    <div class="botoes" id="botoes"></div>
    <p class="assinatura">Desenvolvido por <b>FluxON</b></p>
  </nav>
</main>

<div class="aviso" id="aviso" hidden></div>

<script src="central.js"></script>
